# Lefthook — git hooks for Belayd
# https://lefthook.dev/configuration/
pre-commit:
  jobs:
    - name: biome format + lint (staged)
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --fix --no-errors-on-unmatched {staged_files} && git add {staged_files}
    - name: typecheck
      run: CI=1 pnpm typecheck
    - name: lint (full)
      run: pnpm lint
    - name: tests
      run: pnpm test
