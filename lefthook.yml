# Lefthook — git hooks for Belayd
# https://lefthook.dev/configuration/
#
# `no_tty` disables the spinner/interactive TUI, which avoids the known
# TTY-only intermittent hang in lefthook (see evilmartians/lefthook#1256).
no_tty: true

pre-commit:
  jobs:
    - name: biome format + lint (staged)
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --fix --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: lint (full)
      run: pnpm lint

# Typecheck, tests, build, and the flake package build are moved off the
# commit path to keep pre-commit short — the longer the hook runs, the larger
# the window for the TTY hang.
pre-push:
  jobs:
    - name: typecheck
      run: CI=1 pnpm typecheck
    - name: tests
      run: pnpm test
    # `tsc --noEmit` (typecheck above) skips declaration emit, which can still
    # fail on private-name leaks; the emit is an explicit acceptance criterion.
    - name: build
      run: pnpm build
    # belayd-harness.pnpmDeps.hash is a fixed-output hash over the full
    # pnpm-lock.yaml store, so any lockfile change (devDependencies included)
    # invalidates it. Nothing else in the hook can see that. Gated on the files
    # that can move the hash; fast when the pinned store is already cached.
    - name: flake package build (belayd-harness)
      glob: "{flake.nix,flake.lock,pnpm-lock.yaml,package.json}"
      run: nix build .#belayd-harness --no-link
