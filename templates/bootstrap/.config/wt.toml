# Worktrunk Project Configuration
#
# Hooks run by `wt` when creating and merging worktrees.

[post-create]
# Copy gitignored files (node_modules, .pnpm-store, etc.) from primary worktree
copy = "wt step copy-ignored"
# Allow direnv and install dependencies in the new worktree
install = "direnv allow && pnpm install"
# Move the bead for this branch to in_progress when the worktree is created
mark-in-progress = 'bd_id="$(printf "%s" "{{ branch }}" | sed "s#^[^/]*/##")"; case "$bd_id" in bd-*) bd update "$bd_id" --status in_progress --add-label human ;; esac'

[post-merge]
# Human reviewed + merged — close the bead (never done by agents)
close = 'bd_id="$(printf "%s" "{{ branch }}" | sed "s#^[^/]*/##")"; case "$bd_id" in bd-*) bd close "$bd_id" --reason "merged via wt" ;; esac'

[merge]
squash = false
