# Worktrunk Project Configuration
#
# Project-specific hooks for the Belayd monorepo.
# Ensures worktrees have dependencies available after creation.

[post-create]
# Copy gitignored files (node_modules, .pnpm-store, etc.) from primary worktree
copy = "wt step copy-ignored"
# Allow direnv, install dependencies, and build local packages the extension needs
install = "direnv allow && pnpm install && pnpm turbo run build --filter=@belayd/agent-harness --filter=@belayd/agent-shared"
build = "pnpm build"
# Move the bead for this branch to in_progress when the worktree is created
mark-in-progress = 'bd_id="$(printf "%s" "{{ branch }}" | sed "s#^[^/]*/##")"; case "$bd_id" in bd-*) bd update "$bd_id" --status in_progress ;; esac'

[post-merge]
# Human reviewed + merged — close the bead (never done by agents)
close = 'bd_id="$(printf "%s" "{{ branch }}" | sed "s#^[^/]*/##")"; case "$bd_id" in bd-*) bd close "$bd_id" --reason "merged via wt" ;; esac'

[merge]
squash = false
